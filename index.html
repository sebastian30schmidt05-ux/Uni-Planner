<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f6fb">
<title>Uni Planner – Version 1.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:light;--bg:#f2f5fb;--panel:#ffffff;--panel2:#f7f9fd;--ink:#172238;--muted:#68758b;--line:#e5eaf3;--accent:#536dfe;--accent-soft:#eef0ff;--green:#13865e;--green-soft:#e5f7ef;--red:#c24152;--shadow:0 12px 34px #26365a0c}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101725;--panel:#182337;--panel2:#202d42;--ink:#edf3ff;--muted:#a6b3c8;--line:#30405a;--accent:#9aaaff;--accent-soft:#293653;--green:#58d2a1;--green-soft:#1e4038;--red:#ff8794;--shadow:0 12px 34px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 13px;transition:.15s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px;font-weight:800;font-size:19px;letter-spacing:-.5px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);padding:0 10px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;display:flex;gap:12px;align-items:center;color:var(--muted);padding:11px 12px}.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.nav .ico{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;display:grid;gap:9px}.privacy{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}main{min-width:0;padding:30px clamp(18px,3vw,42px) 50px;max-width:1600px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.title{font-size:clamp(25px,3vw,34px);letter-spacing:-1.1px;margin:3px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.subtle{background:var(--panel2)}.weekbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.weekname{font-weight:750;font-size:17px;margin-right:auto}.weekdays{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}.day{background:var(--panel);border:1px solid var(--line);border-radius:15px;min-height:245px;padding:13px;box-shadow:var(--shadow)}.dayhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-weight:750}.dayhead small{display:block;color:var(--muted);font-weight:500}.today .dayhead span:first-child{color:var(--accent)}.lecture{border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:10px;padding:10px;margin-bottom:9px;background:var(--panel2)}.lecture.visited{border-color:var(--green);border-left-color:var(--green);background:var(--green-soft)}.lec-top{display:flex;align-items:flex-start;gap:8px}.lec-title{font-weight:750;overflow-wrap:anywhere;flex:1}.lec-meta{font-size:12px;color:var(--muted);margin-top:3px}.visit{width:29px;height:29px;padding:0;border-radius:50%;flex:none;color:var(--muted)}.visited .visit{background:var(--green);color:white;border-color:var(--green)}.mini-tasks{display:grid;gap:5px;margin-top:10px;font-size:12px}.mini-tasks label{display:flex;gap:7px;align-items:center;color:var(--muted)}input[type=checkbox]{accent-color:var(--green);width:15px;height:15px}.mini-tasks label.done span{text-decoration:line-through;opacity:.7}.lecture-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.text-btn{border:0;background:transparent;padding:3px 5px;color:var(--muted);font-size:12px}.add-day{width:100%;border-style:dashed;color:var(--muted);background:transparent}.empty{color:var(--muted);font-size:13px;padding:15px 4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow);margin-bottom:15px}.panel h2{font-size:17px;margin:0 0 13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.list{display:grid;gap:8px}.list-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--panel2)}.list-row .grow{flex:1;min-width:0}.list-row small{display:block;color:var(--muted)}.list-row.done{opacity:.65}.list-row.done strong{text-decoration:line-through}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px}.field textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.tag{font-size:11px;border-radius:99px;padding:3px 8px;background:var(--accent-soft);color:var(--accent);font-weight:700}.muted{color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:5}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:0 25px 80px #0004}.dialog h2{margin:0 0 18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{padding:11px 13px;border-radius:10px;background:var(--green-soft);color:var(--green);font-size:13px;margin-bottom:15px}
@media(max-width:1050px){.weekdays{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.app{grid-template-columns:1fr}aside{padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:4px}.nav{grid-template-columns:repeat(4,1fr)}.nav-label,.privacy,.side-bottom{display:none}.nav button{justify-content:center;padding:9px 4px;font-size:12px;gap:5px;flex-direction:column}.nav .ico{font-size:16px}main{padding:20px 13px 35px}.weekdays{grid-template-columns:1fr}.day{min-height:0}.topline{align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}

/* Version 1.1 – visuelles Feintuning */
body{background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 38%),var(--bg)}
aside{padding:27px 17px;background:color-mix(in srgb,var(--panel) 94%,var(--accent) 6%)}
.brand{font-size:20px;letter-spacing:-.7px}.logo{box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 30%,transparent);border-radius:13px}
.nav button{border-radius:11px;font-weight:600}.nav button.active{box-shadow:inset 3px 0 var(--accent)}
main{padding-top:34px}.title{font-size:clamp(28px,3.2vw,38px);letter-spacing:-1.4px}
.day{border-radius:17px;padding:14px;transition:border-color .18s,transform .18s}.day:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.lecture{border-radius:12px;padding:11px;box-shadow:0 3px 10px #18223508;transition:transform .16s,box-shadow .16s}.lecture:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lecture.visited{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 22%,transparent)}
button{border-radius:11px;font-weight:600}button.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 24%,transparent)}
.panel,.stat{border-radius:16px}.list-row{border-radius:12px}.dialog{border-radius:20px}
.color-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.color-option{position:relative;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:9px;background:var(--panel2);cursor:pointer;min-width:0}
.color-option input{position:absolute;opacity:0;inset:0;cursor:pointer}
.color-dot{width:22px;height:22px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px #0001}
.color-option span:last-child{font-size:13px;font-weight:650}
.color-option:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}
.color-option:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
@media(max-width:480px){.color-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">U</div><span>Uni Planner</span></div>
  <div><div class="nav-label">Arbeitsbereich</div><nav class="nav" aria-label="Hauptnavigation">
    <button class="active" data-page="week"><span class="ico">▦</span>Wochenplan</button>
    <button data-page="tasks"><span class="ico">☑</span>Aufgaben</button>
    <button data-page="exams"><span class="ico">🎓</span>Prüfungen</button>
    <button data-page="notes"><span class="ico">✎</span>Notizen</button>
  </nav></div>
  <div class="side-bottom"><div class="privacy">🔒 <b>Deine Daten bleiben lokal.</b><br>Offline nutzbar · Daten bleiben auf diesem Gerät.</div><button id="exportBtn">↓ Backup exportieren</button><button id="importBtn">↑ Backup importieren</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
</aside>
<main>
  <div class="topline"><div><div class="eyebrow">Dein Semester, dein Überblick</div><h1 class="title" id="pageTitle">Wochenplan</h1></div><div class="actions"><button id="quickAdd" class="primary">＋ Neu erstellen</button></div></div>
  <section id="weekPage">
    <div class="weekbar"><button id="prevWeek">←</button><button id="todayBtn">Heute</button><button id="nextWeek">→</button><div class="weekname" id="weekLabel"></div><label class="muted">Wochenende <input id="weekendToggle" type="checkbox"></label></div>
    <div class="notice">Tipp: Klicke auf den Kreis einer Vorlesung, um sie als besucht zu markieren. Aufgaben kannst du einzeln abhaken.</div>
    <div class="weekdays" id="weekGrid"></div>
  </section>
  <section id="tasksPage" class="hidden"><div class="stats" id="taskStats"></div><div class="toolbar"><button class="primary" id="addTask">＋ Aufgabe hinzufügen</button><select id="taskFilter"><option value="all">Alle Aufgaben</option><option value="open">Offen</option><option value="done">Erledigt</option></select></div><div class="panel"><div class="list" id="taskList"></div></div></section>
  <section id="examsPage" class="hidden"><div class="toolbar"><button class="primary" id="addExam">＋ Prüfung hinzufügen</button></div><div class="panel"><div class="list" id="examList"></div></div></section>
  <section id="notesPage" class="hidden"><div class="toolbar"><button class="primary" id="addNote">＋ Notiz erstellen</button><input id="noteSearch" placeholder="Notizen durchsuchen …" style="border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel)"></div><div class="list" id="noteList"></div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Neu</h2><form id="modalForm"><div id="modalFields"></div><div class="dialog-actions"><button type="button" id="cancelModal">Abbrechen</button><button class="primary" type="submit">Speichern</button></div></form></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s),DAY=86400000,KEY="uniplaner-v1",NEWKEY="uni-planner-v2";
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),fromISO=s=>new Date(s+"T12:00:00"),monday=d=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x},plus=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n),fmt=s=>s?new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}).format(fromISO(s)):"";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data={lectures:[],weeks:{},tasks:[],exams:[],notes:[],weekend:false},view=monday(new Date()),page="week",modalType=null,editId=null;
function load(){try{let raw=localStorage.getItem(NEWKEY);if(raw)data={...data,...JSON.parse(raw)};else{let old=JSON.parse(localStorage.getItem(KEY)||"null");if(old&&Array.isArray(old.lectures)){data.lectures=old.lectures;data.weeks=old.weeks||{};data.weekend=!!old.weekend;}}}catch(e){console.warn("Lokale Daten konnten nicht gelesen werden",e)}}
function save(){try{localStorage.setItem(NEWKEY,JSON.stringify(data))}catch(e){alert("Speichern nicht möglich. Bitte exportiere ein Backup.")}}
const weekKey=()=>iso(view),weekData=id=>(data.weeks[weekKey()]||{})[id]||{visited:false,checks:{}};
function setWeekData(id,fn){let w=data.weeks[weekKey()]??={};let x=w[id]??={visited:false,checks:{}};fn(x);save();renderWeek()}
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));["week","tasks","exams","notes"].forEach(x=>$("#"+x+"Page").classList.toggle("hidden",x!==p));$("#pageTitle").textContent=({week:"Wochenplan",tasks:"Aufgaben",exams:"Prüfungskalender",notes:"Notizen"})[p];$("#quickAdd").textContent=({week:"＋ Vorlesung",tasks:"＋ Aufgabe",exams:"＋ Prüfung",notes:"＋ Notiz"})[p];render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
function renderWeek(){let count=data.weekend?7:5;$("#weekLabel").textContent="KW "+Math.ceil((((plus(view,3)-new Date(plus(view,3).getFullYear(),0,1))/DAY)+1)/7)+" · "+fmt(iso(view))+" – "+fmt(iso(plus(view,count-1)));$("#weekendToggle").checked=data.weekend;let names=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];$("#weekGrid").innerHTML=Array.from({length:count},(_,i)=>{let date=plus(view,i),key=iso(date),today=key===iso(new Date()),items=data.lectures.filter(l=>+l.day===i&&(l.repeat||l.week===weekKey())).sort((a,b)=>(a.start||"").localeCompare(b.start||""));return `<article class="day ${today?"today":""}"><div class="dayhead"><span>${names[i]}<small>${fmt(key)}</small></span>${today?'<span class="tag">Heute</span>':""}</div>${items.length?items.map(l=>{let st=weekData(l.id),todos=l.todos||[];return `<div class="lecture ${st.visited?"visited":""}" style="--c:${["#4263eb","#16845b","#c16b2d","#9360bd","#c34b65","#798a35"][Math.max(0,Math.min(5,+l.color||0))]}"><div class="lec-top"><div class="lec-title">${esc(l.name)}</div><button class="visit" title="Besuch markieren" aria-label="Besuch markieren" data-visit="${esc(l.id)}">${st.visited?"✓":"○"}</button></div><div class="lec-meta">${esc(l.start||"")}–${esc(l.end||"")}${l.room?" · "+esc(l.room):""}${l.prof?" · "+esc(l.prof):""}</div>${todos.length?`<div class="mini-tasks">${todos.map(t=>`<label class="${st.checks?.[t.id]?"done":""}"><input type="checkbox" data-check="${esc(l.id)}" data-todo="${esc(t.id)}" ${st.checks?.[t.id]?"checked":""}><span>${esc(t.label)}</span></label>`).join("")}</div>`:""}<div class="lecture-foot"><button class="text-btn" data-edit-lec="${esc(l.id)}">Bearbeiten</button><button class="text-btn" data-delete-lec="${esc(l.id)}">Löschen</button></div></div>`}).join(""):'<div class="empty">Keine Vorlesungen geplant.</div>'}<button class="add-day" data-add-day="${i}">＋ Vorlesung</button></article>`}).join("");}
function renderTasks(){let all=data.tasks,done=all.filter(x=>x.done).length;$("#taskStats").innerHTML=`<div class="stat"><b>${all.length}</b><span>Aufgaben gesamt</span></div><div class="stat"><b>${all.length-done}</b><span>Noch offen</span></div><div class="stat"><b>${done}</b><span>Erledigt</span></div>`;let f=$("#taskFilter").value;let list=all.filter(t=>f==="all"||(f==="done"?t.done:!t.done)).sort((a,b)=>(a.due||"").localeCompare(b.due||""));$("#taskList").innerHTML=list.length?list.map(t=>`<div class="list-row ${t.done?"done":""}"><input type="checkbox" data-task-check="${esc(t.id)}" ${t.done?"checked":""}><div class="grow"><strong>${esc(t.title)}</strong><small>${esc(t.subject||"Allgemein")} · ${t.due?"Fällig: "+fmt(t.due):"Kein Fälligkeitsdatum"}</small></div><span class="tag">${esc(t.priority||"Normal")}</span><button data-task-edit="${esc(t.id)}">Bearbeiten</button><button data-task-del="${esc(t.id)}">×</button></div>`).join(""):'<p class="muted">Keine Aufgaben in dieser Ansicht.</p>'}
function renderExams(){$("#examList").innerHTML=data.exams.length?data.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{let days=Math.ceil((fromISO(e.date)-new Date(new Date().toDateString()))/DAY);return `<div class="list-row"><div class="grow"><strong>${esc(e.title)}</strong><small>${fmt(e.date)}${e.time?" · "+esc(e.time):""}${e.room?" · "+esc(e.room):""}</small></div><span class="tag">${days<0?"Vorbei":days===0?"Heute":"Noch "+days+" Tage"}</span><button data-exam-edit="${esc(e.id)}">Bearbeiten</button><button data-exam-del="${esc(e.id)}">×</button></div>`}).join(""):'<p class="muted">Noch keine Prüfungen eingetragen.</p>'}
function renderNotes(){let q=$("#noteSearch").value.toLowerCase();let arr=data.notes.filter(n=>(n.title+" "+n.body+" "+(n.subject||"")).toLowerCase().includes(q));$("#noteList").innerHTML=arr.length?arr.map(n=>`<article class="panel"><div class="list-row" style="border:0;padding:0;background:transparent"><div class="grow"><strong>${esc(n.title)}</strong><small>${esc(n.subject||"Allgemein")} · ${fmt(n.updated)}</small></div><button data-note-edit="${esc(n.id)}">Öffnen</button><button data-note-del="${esc(n.id)}">×</button></div><p>${esc(n.body).slice(0,260)}${n.body.length>260?" …":""}</p></article>`).join(""):'<p class="muted">Keine Notizen gefunden.</p>'}
function render(){if(page==="week")renderWeek();if(page==="tasks")renderTasks();if(page==="exams")renderExams();if(page==="notes")renderNotes()}
function openModal(type,obj={},day=0){modalType=type;editId=obj.id||null;let fields="",title="";const field=(label,id,value="",kind="text",extra="")=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${kind}" value="${esc(value)}" ${extra}></div>`;
if(type==="lecture"){title=obj.id?"Vorlesung bearbeiten":"Neue Vorlesung";fields=`<div class="formgrid">${field("Name","mName",obj.name||"")}${field("Raum","mRoom",obj.room||"")}${field("Beginn","mStart",obj.start||"08:00","time")}${field("Ende","mEnd",obj.end||"09:30","time")}${field("Dozent","mProf",obj.prof||"")}<div class="field"><label>Wochentag</label><select id="mDay">${["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"].map((n,i)=>`<option value="${i}" ${+(obj.day??day)===i?"selected":""}>${n}</option>`).join("")}</select></div><div class="field full"><label>Farbe des Fachs</label><div class="color-picker" id="mColor">${[["Blau","#4263eb"],["Grün","#16845b"],["Orange","#c16b2d"],["Violett","#9360bd"],["Rot","#c34b65"],["Oliv","#798a35"]].map(([n,c],i)=>`<label class="color-option"><input type="radio" name="lectureColor" value="${i}" ${+(obj.color||0)===i?"checked":""}><span class="color-dot" style="background:${c}"></span><span>${n}</span></label>`).join("")}</div></div><div class="field"><label>Wiederholung</label><select id="mRepeat"><option value="1" ${obj.repeat!==false?"selected":""}>Jede Woche</option><option value="0" ${obj.repeat===false?"selected":""}>Nur diese Woche</option></select></div><div class="field full"><label>Aufgaben (durch Komma trennen, z. B. Skript lesen, Übungsblatt)</label><input id="mTodos" value="${esc((obj.todos||[]).map(t=>t.label).join(", "))}" placeholder="Vorlesung nachbereiten, Übungsblatt"></div></div>`}
if(type==="task"){title=obj.id?"Aufgabe bearbeiten":"Neue Aufgabe";fields=`${field("Aufgabe","mTitle",obj.title||"")}<div class="formgrid">${field("Fach / Vorlesung","mSubject",obj.subject||"")}${field("Fällig am","mDue",obj.due||"","date")}<div class="field"><label>Priorität</label><select id="mPriority">${["Niedrig","Normal","Hoch"].map(x=>`<option ${obj.priority===x?"selected":""}>${x}</option>`).join("")}</select></div></div>`}
if(type==="exam"){title=obj.id?"Prüfung bearbeiten":"Prüfung hinzufügen";fields=`${field("Prüfung / Fach","mTitle",obj.title||"")}<div class="formgrid">${field("Datum","mDate",obj.date||"","date")}${field("Uhrzeit","mTime",obj.time||"","time")}${field("Raum","mRoom",obj.room||"")}${field("Lernziel (optional)","mGoal",obj.goal||"")}</div>`}

function closeModal(){$("#modal").classList.add("hidden")}
$("#cancelModal").onclick=closeModal;$("#modal").onclick=e=>{if(e.target===$("#modal"))closeModal()};
$("#modalForm").onsubmit=e=>{e.preventDefault();let o={id:editId||uid()};const val=id=>$("#"+id)?.value.trim()||"";if(modalType==="lecture"){if(!val("mName")||!val("mStart")||!val("mEnd")||val("mEnd")<=val("mStart"))return alert("Bitte Name und gültige Uhrzeiten eingeben.");let old=data.lectures.find(x=>x.id===editId);Object.assign(o,{name:val("mName"),room:val("mRoom"),start:val("mStart"),end:val("mEnd"),prof:val("mProf"),day:+val("mDay"),color:+($("#mColor input:checked")?.value??0),repeat:val("mRepeat")==="1",week:val("mRepeat")==="1"?null:weekKey(),todos:val("mTodos").split(",").map(x=>x.trim()).filter(Boolean).map(label=>({id:uid(),label}))});if(old){let prev=old.todos||[];o.todos=o.todos.map(t=>{let m=prev.find(x=>x.label===t.label);return m||t});Object.assign(old,o)}else data.lectures.push(o);if(+o.day>4)data.weekend=true}

save();closeModal();render()};
function upsert(arr,o){let i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)}

document.addEventListener("click",e=>{let t=e.target.closest("button");if(!t)return;let id=t.dataset.visit;if(id)setWeekData(id,x=>x.visited=!x.visited);if(t.dataset.addDay!==undefined)openModal("lecture",{},+t.dataset.addDay);if(t.dataset.editLec){let o=data.lectures.find(x=>x.id===t.dataset.editLec);if(o)openModal("lecture",o)}if(t.dataset.deleteLec){if(confirm("Vorlesung wirklich löschen?")){data.lectures=data.lectures.filter(x=>x.id!==t.dataset.deleteLec);save();renderWeek()}}if(t.dataset.taskEdit)openModal("task",data.tasks.find(x=>x.id===t.dataset.taskEdit));if(t.dataset.taskDel&&confirm("Aufgabe löschen?")){data.tasks=data.tasks.filter(x=>x.id!==t.dataset.taskDel);save();renderTasks()}if(t.dataset.examEdit)openModal("exam",data.exams.find(x=>x.id===t.dataset.examEdit));if(t.dataset.examDel&&confirm("Prüfung löschen?")){data.exams=data.exams.filter(x=>x.id!==t.dataset.examDel);save();renderExams()}if(t.dataset.noteEdit)openModal("note",data.notes.find(x=>x.id===t.dataset.noteEdit));if(t.dataset.noteDel&&confirm("Notiz löschen?")){data.notes=data.notes.filter(x=>x.id!==t.dataset.noteDel);save();renderNotes()}});
document.addEventListener("change",e=>{let c=e.target;if(c.dataset.check){let l=data.lectures.find(x=>x.id===c.dataset.check);if(l){let w=data.weeks[weekKey()]??={};let st=w[l.id]??={visited:false,checks:{}};st.checks??={};st.checks[c.dataset.todo]=c.checked;save();renderWeek()}}if(c.dataset.taskCheck){let t=data.tasks.find(x=>x.id===c.dataset.taskCheck);if(t){t.done=c.checked;save();renderTasks()}}});
